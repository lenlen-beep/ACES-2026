net_parameters:
  supply_temperature: 80          # °C
  delta_T: 25                     # K
  specific_heat_capacity: 4.187   # kJ/kgK
  density: 980                   # kg/m3
  cp: 4187                        # J/kgK

system_parameters:

  storage:                        # Buffer Storage (tank)
    initial_storage_capacity: 500 # m3
    max_charge_rate: 0.25         # Anteil der Kapazität pro Stunde (Quelle?)
    max_discharge_rate: 0.25      # Anteil der Kapazität pro Stunde (Quelle?)
    Q_loss: 0.002                 # relativer Verlust [1/h] = 0,2 % der Kapazität pro Stunde
    SOC_init: 0.5                 # Anfangs-/End-Ladezustand (50 %)
    invest_offset_storage: 78021  # Euro (Danish storage catalogue), 0-1000 m3
    specific_invest_storage: 222.71  # Euro/m3, linear 100-1000 m3 (Danish storage catalogue)

  pump:
    gravity: 9.81                 # m/s2
    del_height: 5                 # m (Näherung), alt 5
    eta_pump: 0.9                 # Wirkungsgrad

  HP:                             # Wärmepumpe
    COP: 3.2 # claude: 2,8 - 3,2, alt 3,5
    initial_hp_capacity: 3       # MW
    invest_offset_hp: 0           # Euro
    specific_invest_hp: 1200000    # Euro/MW claude: 800000, alt 1200000
    eta_carnot: 0.45               # Gütegrad rel. zum Carnot-Wirkungsgrad, für COP_t (era5_weather.py)
                                    # Literaturwert, typisch für große WP: 0.40-0.50 (nicht für diese
                                    # Anlage validiert) -- nicht zu verwechseln mit dem statischen COP oben,
                                    # der aktuell im Optimierungsmodell verwendet wird

  gas_boiler:
    eta_gas_boiler: 0.98
    initial_gas_thermal_power: 1 # MW
    specific_invest_gas_boiler: 60000  # Euro/MW
    invest_offset_boiler: 0       # Euro

  seasonal_storage:               # PTES / Grubenspeicher
    invest_offset_seasonal_storage: 892300   # Euro
    specific_invest_seasonal_storage: 50     # Euro/m3 #claude: 80, alt 20
    initial_seasonal_storage_capacity: 10000 # m3
    max_seasonal_charge_rate: 0.003           # Anteil/Stunde (~14 Tage Vollladung)
    max_seasonal_discharge_rate: 0.003        # Anteil/Stunde
    Q_loss_seasonal: 0.00005                  # relativer Verlust [1/h] ≈ 15 % Verlust pro Saison (6 Monate)

  PV:
    invest_offset_pv: 0           # Euro
    specific_invest_pv: 850000    # Euro/MW (= 850 Euro/kWp, 1-10 MWp)
    initial_pv_capacity: 5        # MW
    feed_in_tariff: 50            # Euro/MWh (Ø BNetzA-Gebote 2024-2026)
    specific_area_usage: 100      # Wp/m2
    surface_tilt: 35              # Grad, Modulneigung (Standard Norddeutschland)
    surface_azimuth: 180          # Grad, Südausrichtung (pvlib-Konvention: 180 = Süd)
    performance_ratio: 0.85       # Systemverluste (Verkabelung, Wechselrichter, Verschmutzung, ...)

invest_parameters:
  lifetime_years: 20              # a
  interest_rate: 0.05

price_parameters:                 # SH-Netz 2024

  electricity:
    tarif:                        # ct/kWh all-in
      usual_mid: 16.77
      pre_stress: 21.77
      stress: 35.7
    network_charge:               # SH Netz 2024, Mittelspannung, Preisblatt LG JLP
      lower_2500VBH:
        capacity_charge: 44.70    # Euro/kW*a
        commodity_charge: 8.63    # ct/kWh
      higher_2500VBH:
        capacity_charge: 200.65   # Euro/kW*a
        commodity_charge: 2.39    # ct/kWh
    tax: 2.05                     # ct/kWh
    levies:                       # netzentgeltbasierte Umlagen 2024 (ÜNB, netztransparenz.de)
      kwkg: 0.275                 # ct/kWh, KWKG-Umlage
      offshore: 0.656             # ct/kWh, Offshore-Netzumlage
      special_grid_use: 0.643     # ct/kWh, § 19 StromNEV-Umlage
                                  # Regelsatz Letztverbraucherkategorie A (< 1 Mio. kWh/a)
    concession_fee: 0.11          # ct/kWh, Konzessionsabgabe Sondervertragskunde (KAV)
    vbh_class: lower_2500VBH      # lower_2500VBH | higher_2500VBH -> siehe network_charge
    high_load_window:
      autumn: '16:45 - 19:00'
      winter: '17:00 - 19:15'
    hedge_bandwidth: [0, 0.3, 0.6, 1.0]

  gas:
    tarif:                        # ct/kWh all-in
      usual_mid: 7.2
      pre_stress: 3.3
      stress: 12.2

pipe_parameters:
  kr: 0.04                        # mm
  specific_pressure_loss: 150     # Pa/m
  specific_invest_pipe: 400      # Euro/m
  pipe_catalog:
    - {norm: DN20,  diameter_mm: 21.7}
    - {norm: DN25,  diameter_mm: 28.5}
    - {norm: DN32,  diameter_mm: 37.2}
    - {norm: DN40,  diameter_mm: 43.1}
    - {norm: DN50,  diameter_mm: 54.5}
    - {norm: DN65,  diameter_mm: 70.3}
    - {norm: DN80,  diameter_mm: 82.5}
    - {norm: DN100, diameter_mm: 107.1}
    - {norm: DN125, diameter_mm: 132.5}
    - {norm: DN150, diameter_mm: 160.3}
    - {norm: DN200, diameter_mm: 210.1}
    - {norm: DN250, diameter_mm: 263.0}