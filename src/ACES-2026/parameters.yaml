Net_parameters:
  supply_temperature: 80        #°C
  delta_T: 25                   #K
  specific_heat_capacity: 4.187 #kJ/kgK
  density: 1000                 #kg/m3
  cp: 4187                      #J/kgK

System_parameters:
  Storage: #Buffer Storage (tank)
    initial_storage_capacity: 500   #m3
    max_charge_rate: 0.25           # % of storage capacity per hour (Quelle?)
    max_discharge_rate: 0.25        # % of storage capacity per hour (quelle?)
    Q_loss: 0.167                   # 1.67/(24*1000) #MWh heat loss #TODO!
    SOC_init: 0.0                   # % initial state of charge (start&end) #TODO: geht iwie noch nicht über 0 :)
    invest_offset_storage: 78021       # Euro (Danish storage catalogue pdf) 0-1000m3
    specific_invest_storage: 222.71    # Euro/m3 --> linear data for 100-1000 m3 (Danish storage catalogue pdf) 0-1000m3
  Pump:
    gravity: 9.81 #m/s2
    del_height: 5 #m approximation
    eta_pump: 0.9 # efficiency
  HP:
    COP: 3.5
    initial_hp_capacity: 30   #MW
    invest_offset_hp: 0      # Euro
    specific_invest_hp: 700000   # Euro/MW --> linear data for xxx MW
  Gas_boiler:
    eta_gas_boiler: 0.98
    initial_gas_thermal_power: 30 # MW
    specific_invest_gas_boiler: 2690 # Euro/MW --> linear data for xxx MW
    invest_offset_boiler: 0 # Euro
  Seasonal_storage: #(PTES) Grubenspeicher
    invest_offset_seasonal_storage: 892300 # Euro claude vorschlag 200000
    specific_invest_seasonal_storage: 20   # Euro/m3 --> claude vorschlag 8
    initial_seasonal_storage_capacity: 10000 # m3
    max_seasonal_charge_rate: 0.03 # % of storage capacity per hour (Quelle?)
    max_seasonal_discharge_rate: 0.03 # % of storage capacity per hour (Quelle?)
  PV:
    invest_offset_pv: 0          # Euro
    specific_invest_pv: 850000   # Euro/MW (= 850 Euro/kWp für 1-10MWp Anlagen) https://www.logicenergy.de/pv-freiflaechenanlagen --> claude vorschlag 500000
    initial_pv_capacity: 5       # MW
    feed_in_tariff: 50           # Euro/MWh (Durchschnitt der Gebote der Bundesnetzagentur 2024-2026) 
    specific_area_usage: 100 # Wp/m2


Invest_parameters:
  lifetime_years: 20  #a 
  interest_rate: 0.05 

